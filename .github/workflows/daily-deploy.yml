# 毎日1回 Cloudflare Pages のデプロイフックを叩いて再ビルドさせる（=ランキング・新着の更新）
# 事前に GitHub リポジトリの Secrets に CF_DEPLOY_HOOK_URL を登録しておく。
name: daily-deploy
on:
  schedule:
    - cron: '17 21 * * *' # 毎日 06:17 JST
  workflow_dispatch:
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages build
        env:
          HOOK: ${{ secrets.CF_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "CF_DEPLOY_HOOK_URL が未設定のためスキップします"
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
